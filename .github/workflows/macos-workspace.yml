# Linux workspace checks and Mac duckctl builds cannot catch a Mac daemon import failure.
name: macOS workspace

"on":
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: macos-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo +1.94.1 test --workspace --locked
